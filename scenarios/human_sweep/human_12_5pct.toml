# =============================================================================
# Human-fraction sweep point: 12.5% human bots, 2500 agents total,
# 100000s simulated (fixed -- no min_trades auto-extension).
#
# Generated from scenarios/realistic_mix.toml: every non-human bot type/variant is
# rescaled to keep its *relative* share of the non-human population exactly what
# it is in that base template, so this sweep only varies "how much of the market
# is human" -- not the relative mix of everything else. See realistic_mix.toml
# for the full per-bot-type rationale/comments (stripped here to keep this file's
# numbers front and center -- edit the base template if the rationale itself needs
# to change, then regenerate this sweep).
#
# Same seed (1) as every other point in this sweep -- composition is the only
# thing varying, not the RNG realization. Human count: 312 (12.5%).
# Generated 2026-09-16 to fill the 2.5%-step gaps in the original 0/10/20%-step sweep.
# =============================================================================

[[assets]]
symbol = "BTC"
tick_size = 0.5
initial_price = 60000.0
fundamental_vol = 0.015
fundamental_theta = 0.08

[[assets]]
