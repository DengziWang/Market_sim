# =============================================================================
# Scenario (a): "Realistischer Mix" -- the finalized realistic-composition template
# (spec section 12's previously-deferred bot-type weighting decision). Calibrated
# toward the report's anchor values (see docs/marktgesundheit_bericht.md); treat this
# as the default starting point for real runs, and re-derive counts the same way
# (below) if your own research question needs a different mix.
#
# Reasoning behind the counts below:
#   - market_maker: modest headcount (8%) but each MM requotes every ~0.2-1s vs.
#     momentum/mean-reversion/DCA bots waking every several seconds to minutes, so a
#     small headcount plausibly still accounts for the majority of *volume* -- the
#     report's real-market anchor (~50-60% of volume) is a volume share, not a count
#     share. Verified via market_health's concentration/HHI output on a real run
#     rather than assumed -- adjust counts if your own run doesn't bear it out.
#   - mev: spec 5.8 explicitly calls for a small, heavily concentrated population
#     (a handful of very-active agents), not an even spread.
#   - wash_trading: removed from this template (2026-09-12, at the user's request,
#     after investigating a real run) -- see stress_wash_mev.toml if you want it back
#     for a run specifically studying wash-trading detection/authenticity metrics.
#   - retail baseline (noise + human, ~57% headcount combined): consistent with real
#     markets where retail participants vastly outnumber HFT/algorithmic firms even
#     though they don't dominate volume. Split across two different retail models
#     rather than one:
#       - noise::zero_intelligence (200, 40%): the spec's mandated Gode & Sunder
#         (1993) memoryless control group everything else gets compared against --
#         kept at full weight, not diluted by the human split below.
#       - noise::herding (44, 8.8%) + human::retail (40, 8%): both represent
#         behaviorally-driven (not mechanical) retail, so the herding slice that
#         previously stood alone is split with the richer, biased `human` model
#         (disposition effect, FOMO/panic on price+sentiment, hot-hand sizing,
#         irregular attention -- see README's `human` bots section) -- two takes on
#         the same underlying "crowd-following, not memoryless" retail behavior
#         rather than one head-count bucket standing in for both.
# =============================================================================

[run]
seed = 1
session_seconds = 1800.0        # 30 min nominal; extends automatically toward min_trades
min_trades = 10000
max_session_seconds = 21600.0   # cap at 6h (spec 6a upper bound)
extension_step_seconds = 1800.0

[[assets]]
symbol = "BTC"
tick_size = 0.5
initial_price = 60000.0
fundamental_vol = 0.015
fundamental_theta = 0.08

[[assets]]
symbol = "ETH"
tick_size = 0.05
initial_price = 3000.0
fundamental_vol = 0.02
fundamental_theta = 0.08

[[assets]]
symbol = "SOL"
tick_size = 0.01
initial_price = 150.0
fundamental_vol = 0.03
fundamental_theta = 0.1

[[assets]]
symbol = "XRP"
tick_size = 0.0001
initial_price = 0.6
fundamental_vol = 0.025
fundamental_theta = 0.1

[[assets]]
symbol = "DOGE"
tick_size = 0.00001
initial_price = 0.15
fundamental_vol = 0.04
fundamental_theta = 0.12

[[venues]]
name = "primary"
inter_venue_latency_secs = 0.05

[[venues]]
name = "secondary"
inter_venue_latency_secs = 0.08

[market]
snapshot_interval_secs = 1.0
snapshot_depth_levels = 10
mark_price_ema_halflife_secs = 30.0

[fees]
default_maker_fee = 0.0002
default_taker_fee = 0.0005
[fees.by_bot_type]
market_maker = [0.0000, 0.0004]

[latency]
default_latency_secs = 0.08
[latency.by_bot_type]
market_maker = 0.03
arbitrage = 0.02
mev = 0.01
noise = 0.3

[mempool]
enabled = true
reveal_delay_secs = 0.4
large_order_notional_threshold = 25000.0

[liquidation]
maintenance_margin_buffer = 0.8
sweep_interval_secs = 1.0
staggered_slices = 5
full_liquidation_fraction = 0.5

[export]
out_dir = "runs/realistic_mix"
write_snapshots = true

# ---- market_maker (40 agents, 8%) -----------------------------------------------
[[population.groups]]
bot_type = "market_maker"
variant = "avellaneda_stoikov"
count = 10
initial_cash_range = [20000.0, 80000.0]
[population.groups.params]
wake_interval_secs = 0.3

[[population.groups]]
bot_type = "market_maker"
variant = "fixed_offset"
count = 10
initial_cash_range = [20000.0, 80000.0]

[[population.groups]]
bot_type = "market_maker"
variant = "inventory_skew"
count = 10
initial_cash_range = [20000.0, 80000.0]

[[population.groups]]
bot_type = "market_maker"
variant = "adaptive_spread"
count = 10
initial_cash_range = [20000.0, 80000.0]

