variant = "sandwich"
count = 2
initial_cash_range = [100000.0, 300000.0]
[population.groups.params]
wake_interval_secs = 0.02

[[population.groups]]
bot_type = "mev"
variant = "frontrun"
count = 2
initial_cash_range = [100000.0, 300000.0]
