# ---- noise / retail baseline (244 agents, 48.8%) ----------------------------------------
[[population.groups]]
bot_type = "noise"
variant = "zero_intelligence"
count = 200
initial_cash_range = [500.0, 15000.0]

[[population.groups]]
bot_type = "noise"
variant = "herding"
count = 44
initial_cash_range = [500.0, 15000.0]

# ---- human / behaviorally-rich retail (40 agents, 8%) ------------------------------------
# See the header comment above -- the other half of the retail-headcount anchor,
# modeling disposition effect / FOMO-panic / hot-hand sizing / irregular attention
# rather than noise::herding's simpler linear crowd-following.
[[population.groups]]
bot_type = "human"
variant = "retail"
count = 40
initial_cash_range = [1000.0, 20000.0]
