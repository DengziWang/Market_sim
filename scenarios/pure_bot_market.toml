# =============================================================================
# Scenario (b): "Reiner Bot-Markt ohne Noise-Trader" -- the actual research question
# from the prompt's title. Same total headcount (~500) as realistic_mix.toml, with
# the retail group's share (56.8% -- realistic_mix.toml's noise + human bots
# combined) redistributed proportionally across every other bot type, so this is a
# like-for-like comparison of "same size market, humans replaced by more bots"
# rather than "smaller market". No `noise` *or* `human` bots here at all -- both are
# retail/human representations, so a "pure bot market" excludes both, not just one.
#
# Compare market_health scores between this file and realistic_mix.toml (same seeds)
# to see the effect of removing the retail/human population entirely -- that
# comparison is the core of the research question in prompt section 1.
# =============================================================================

[run]
seed = 1
session_seconds = 1800.0
min_trades = 10000
max_session_seconds = 21600.0
extension_step_seconds = 1800.0

[[assets]]
symbol = "BTC"
tick_size = 0.5
initial_price = 60000.0
fundamental_vol = 0.015
fundamental_theta = 0.08

[[assets]]
symbol = "ETH"
tick_size = 0.05
initial_price = 3000.0
fundamental_vol = 0.02
fundamental_theta = 0.08

[[assets]]
symbol = "SOL"
tick_size = 0.01
initial_price = 150.0
fundamental_vol = 0.03
fundamental_theta = 0.1

[[assets]]
symbol = "XRP"
tick_size = 0.0001
initial_price = 0.6
fundamental_vol = 0.025
fundamental_theta = 0.1

[[assets]]
symbol = "DOGE"
tick_size = 0.00001
initial_price = 0.15
fundamental_vol = 0.04
fundamental_theta = 0.12

[[venues]]
name = "primary"
inter_venue_latency_secs = 0.05

[[venues]]
name = "secondary"
inter_venue_latency_secs = 0.08

[market]
snapshot_interval_secs = 1.0
snapshot_depth_levels = 10
mark_price_ema_halflife_secs = 30.0

[fees]
default_maker_fee = 0.0002
default_taker_fee = 0.0005
[fees.by_bot_type]
market_maker = [0.0000, 0.0004]
wash_trading = [0.0002, 0.0005]

[latency]
default_latency_secs = 0.08
[latency.by_bot_type]
market_maker = 0.03
arbitrage = 0.02
mev = 0.01

[mempool]
enabled = true
reveal_delay_secs = 0.4
large_order_notional_threshold = 25000.0

[liquidation]
maintenance_margin_buffer = 0.8
sweep_interval_secs = 1.0
staggered_slices = 5
full_liquidation_fraction = 0.5

[export]
out_dir = "runs/pure_bot_market"
write_snapshots = true

# ---- market_maker (90 agents, 18%) -----------------------------------------------
[[population.groups]]
bot_type = "market_maker"
variant = "avellaneda_stoikov"
count = 23
initial_cash_range = [20000.0, 80000.0]
[population.groups.params]
wake_interval_secs = 0.3

[[population.groups]]
bot_type = "market_maker"
variant = "fixed_offset"
count = 23
initial_cash_range = [20000.0, 80000.0]

[[population.groups]]
bot_type = "market_maker"
variant = "inventory_skew"
count = 22
initial_cash_range = [20000.0, 80000.0]

[[population.groups]]
bot_type = "market_maker"
variant = "adaptive_spread"
count = 22
initial_cash_range = [20000.0, 80000.0]

