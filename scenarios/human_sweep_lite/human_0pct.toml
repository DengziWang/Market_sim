# =============================================================================
# Human-fraction sweep point (noise-free design): 0% human/retail bots,
# 2500 agents base (scaled at runtime), 100000s simulated in this base template.
#
# Noise removed entirely (2026-09-17), NOT replaced by human/lite (that variant
# exists in the engine -- sim_core/src/bots/human.rs's Variant::Lite -- but is
# unused in this sweep, per explicit decision: it also carries bot_type="human",
# which would make "0%" ambiguous between retail's own share and
# retail+lite combined). Instead, the (100-0)% non-retail share is filled
# entirely by the 8 strategic bot types (market_maker, arbitrage, momentum,
# mean_reversion, grid, dca, liquidation_trader, mev), scaled up proportionally
# at their unchanged mutual ratios from realistic_mix.toml -- so "0%" is
# unambiguously bot_type="human" (all of it, since only variant="retail" is
# used here) as a fraction of the total population.
#
# Same seed (1) as every other point in this sweep. human/retail count: 0 (0%).
# =============================================================================

