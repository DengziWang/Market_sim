[package]
name = "sim_core"
version = "0.1.0"
edition = "2021"
description = "Event-driven multi-asset limit order book market simulation core (bot-dominated crypto market research)"

[lib]
name = "sim_core"
crate-type = ["rlib"]

[dependencies]
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1.10"
ordered-float = "4"
# Faster hasher for the per-asset/per-(venue,asset) HashMaps in market.rs/agent.rs
# (asset/venue counts are always small -- a handful, not thousands): std's default
# SipHash is deliberately DoS-resistant, which costs real speed for small integer
# keys looked up millions of times a run; FxHash (used throughout rustc itself for
# the same reason) is markedly faster for this shape of key with no behavior
# change -- same HashMap API/semantics, purely a different hash algorithm. Not
# used for anything keyed by untrusted external input (nothing here is), so the
# DoS-resistance SipHash exists for isn't a concern being traded away.
rustc-hash = "1"
# Checkpoint wire format: self-describing (unlike bincode) so it round-trips
# `toml::Value` (BotGroupConfig::params, deliberately dynamic) and the market's
# tuple-keyed order-book maps (HashMap<(VenueId, AssetId), _>, which JSON can't
# represent since it requires string map keys) without extra glue code.
ciborium = "0.2"

[dev-dependencies]
approx = "0.5"
