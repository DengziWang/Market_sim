[package]
name = "sim_core"
version = "0.1.0"
edition = "2021"
description = "Event-driven multi-asset limit order book market simulation core (bot-dominated crypto market research)"

[lib]
name = "sim_core"
crate-type = ["rlib"]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1.10"
ordered-float = "4"

[dev-dependencies]
approx = "0.5"
